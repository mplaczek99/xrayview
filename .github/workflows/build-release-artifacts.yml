name: Build release artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-desktop-archive:
    name: Build desktop archive (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact_name: xrayview-linux-desktop-archive
          - os: windows-latest
            label: Windows
            artifact_name: xrayview-windows-desktop-archive

    defaults:
      run:
        shell: bash

    steps:
      - name: Preserve repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and smoke-test desktop binary
        run: npm run release:smoke

      - name: Collect desktop binary
        run: |
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"

          binary="desktop/build/bin/xrayview"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="desktop/build/bin/xrayview.exe"
          fi

          if [ ! -f "$binary" ]; then
            printf 'No Wails desktop binary found at %s\n' "$binary" >&2
            exit 1
          fi

          cp "$binary" "$asset_dir/"
          printf 'ASSET_DIR=%s\n' "$asset_dir" >> "$GITHUB_ENV"

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ASSET_DIR }}/*
          if-no-files-found: error
