name: Build release artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-desktop-archive:
    name: Build desktop archive (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact_name: xrayview-linux-desktop-archive
          - os: windows-latest
            label: Windows
            artifact_name: xrayview-windows-desktop-archive

    defaults:
      run:
        shell: bash

    steps:
      - name: Preserve repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and smoke-test desktop bundles
        run: npm run release:smoke:bundle

      - name: Collect desktop bundles
        run: |
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"

          find desktop-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} "$asset_dir/" \;

          if ! find "$asset_dir" -type f | grep -q .; then
            printf 'No Tauri bundle assets found\n' >&2
            exit 1
          fi

          printf 'ASSET_DIR=%s\n' "$asset_dir" >> "$GITHUB_ENV"

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ASSET_DIR }}/*
          if-no-files-found: error
