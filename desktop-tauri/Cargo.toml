[package]
name = "xrayview-desktop-tauri"
version = "0.1.0"
edition = "2024"
description = "Tauri desktop shell for xrayview"

[[bin]]
name = "xrayview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xrayview-backend-rs = { path = "../backend-rs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
