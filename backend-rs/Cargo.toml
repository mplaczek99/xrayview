[package]
name = "xrayview-backend-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.9"
parking_lot = "0.12.5"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
